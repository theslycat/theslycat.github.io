<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>初等行变换 = 左乘初等矩阵 · 行列式如何变化</title>
<style>
  :root{
    --bg:#12151c; --panel:#1a1f29; --panel2:#222838; --line:#2e3646;
    --txt:#e8ecf3; --dim:#9aa5b5; --acc:#6cb6ff; --acc2:#f0a35e; --ok:#7bd88f; --warn:#ff7b72;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;padding:20px;}
  h1{font-size:18px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:14px}
  .wrap{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  #left{flex:0 0 330px}
  #right{flex:1;min-width:300px}
  table.m{border-collapse:collapse;font-family:Consolas,monospace;font-size:19px;margin:6px 0}
  table.m td{padding:7px 13px;text-align:center;min-width:40px;background:var(--panel2);border-radius:6px;transition:all .4s}
  table.m td.hl{background:#31435f;color:var(--acc)}
  table.m tr td:first-child{background:none;color:var(--dim);font-size:12px;min-width:0;padding-right:4px}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
  button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 13px;font-size:13px;cursor:pointer}
  button:hover{border-color:var(--acc);color:var(--acc)}
  label{font-size:13px;color:var(--dim)}
  input[type=range]{accent-color:#f0a35e;vertical-align:middle}
  .detline{font-family:Consolas,monospace;font-size:15px;margin-top:12px;line-height:2;color:var(--dim)}
  .detline b{color:var(--acc2);font-size:18px}
  .expl{margin-top:12px;font-size:13.5px;line-height:1.8;color:var(--dim);background:var(--panel2);border-radius:10px;padding:12px}
  .expl em{color:var(--ok);font-style:normal}
  .expl s{color:var(--warn)}
  .rule{margin-top:10px;font-size:12.5px;color:var(--dim);line-height:1.8}
</style>
</head>
<body>
<h1>初等行变换 = 左乘初等矩阵</h1>
<div class="sub">对 A 做一次初等行变换，等价于在左边乘一个相应的初等矩阵 E：EA。同时观察 det 的变化规律。</div>
<div class="wrap">
  <div class="card" id="left">
    <div style="font-size:13px;color:var(--dim)">当前矩阵 A</div>
    <table class="m" id="matA"></table>
    <div class="btns">
      <button id="swap">对调 r₁ ↔ r₂</button>
      <button id="scale">r₂ × k</button>
      <button id="add">r₁ + k·r₂</button>
      <button id="undo">↩ 撤销</button>
      <button id="reset">重置</button>
    </div>
    <label>k = <span id="kv" style="color:var(--acc2)">2.0</span></label>
    <input type="range" id="k" min="-3" max="3" step="0.5" value="2" style="width:100%">
    <div class="detline">
      det A = <b id="detv">1</b> ｜ 已做变换：<b id="cnt">0</b> 次
    </div>
    <div class="rule">
      ▪ 对调两行：det 变号（E(i,j)，det E = −1）<br>
      ▪ 某行 ×k：det 变 k 倍（E(i(k))，det E = k）<br>
      ▪ 行 +k·行：det <b style="color:var(--ok)">不变</b>（E(i,j(k))，det E = 1）
    </div>
  </div>
  <div class="card" id="right">
    <div style="font-size:13px;color:var(--dim)">运算记录</div>
    <div id="Eshow" style="font-family:Consolas,monospace;font-size:14px;color:var(--acc);margin:8px 0;min-height:24px">—</div>
    <div class="expl" id="expl">点击左侧按钮，观察矩阵如何变化、det 如何变化。每次变换都对应一个左乘的初等矩阵 E，A 的新值是 E·A。</div>
  </div>
</div>

<script>
let A = [[1,2,3],[4,5,6],[7,8,10]];
let det = 1*5*10-1*6*8+2*6*7-2*4*10+3*4*8-3*5*7; // = -3
let steps = [];
let k = 2;
const matEl = document.getElementById('matA');

function det3(M){
  return M[0][0]*(M[1][1]*M[2][2]-M[1][2]*M[2][1])
       - M[0][1]*(M[1][0]*M[2][2]-M[1][2]*M[2][0])
       + M[0][2]*(M[1][0]*M[2][1]-M[1][1]*M[2][0]);
}
function render(hlRows){
  let h = "";
  for(let r=0;r<3;r++){
    h += `<tr><td>r${r+1}</td>`;
    for(let c=0;c<3;c++){
      const v = Math.round(A[r][c]*100)/100;
      h += `<td class="${hlRows&&hlRows.includes(r)?'hl':''}">${v}</td>`;
    }
    h += "</tr>";
  }
  matEl.innerHTML = h;
  document.getElementById('detv').textContent = Math.round(det*100)/100;
  document.getElementById('cnt').textContent = steps.length;
}
function pushHistory(m, d){ steps.push({m: JSON.parse(JSON.stringify(m)), d}); }
function E(name){ document.getElementById('Eshow').textContent = name; }

document.getElementById('k').addEventListener('input', e=>{
  k = parseFloat(e.target.value);
  document.getElementById('kv').textContent = k.toFixed(1);
});
document.getElementById('swap').onclick = ()=>{
  pushHistory(A, det);
  [A[0],A[1]] = [A[1],A[0]];
  det = -det;
  E("E = E(1,2) = [[0,1,0],[1,0,0],[0,0,1]]，det E = −1");
  expl("对调 r₁ ↔ r₂：相当于左乘 E(1,2)。矩阵两行交换位置，行列式<em>变号</em>。若两行本来就相同，交换后矩阵不变而行列式变号 ⇒ 只能 det = −det ⇒ <em>det = 0</em>（推论 1）。");
  render([0,1]);
};
document.getElementById('scale').onclick = ()=>{
  if(k===0){ expl("k = 0 不是合法的倍乘变换（要求非零数）。"); return; }
  pushHistory(A, det);
  A[1] = A[1].map(x=>x*k);
  det = det*k;
  E(`E = E(2(${k}))，det E = ${k}`);
  expl(`把第 2 行整体 × ${k}：相当于左乘 E(2(${k}))。行列式整体 × ${k}。推论 2：用数 k 乘行列式 = 用 k 乘某一行；推论 4：<em>|kA| = k³|A|</em>（3 阶，k 提了 3 次！）。`);
  render([1]);
};
document.getElementById('add').onclick = ()=>{
  pushHistory(A, det);
  for(let c=0;c<3;c++) A[0][c] += k*A[1][c];
  E(`E = E(1,2(${k}))，det E = 1`);
  expl(`把第 2 行的 ${k} 倍加到第 1 行：相当于左乘 E(1,2(${k}))。det E = 1，所以行列式<em>不变</em>——这正是「上三角化」计算行列式的核心工具。`);
  render([0]);
};
document.getElementById('undo').onclick = ()=>{
  if(!steps.length) return;
  const s = steps.pop();
  A = s.m; det = s.d;
  E("—（已撤销）");
  expl("已撤销上一步。注意：撤销「对调」和「倍乘」会改变行列式，撤销「倍加」不变。");
  render();
};
document.getElementById('reset').onclick = ()=>{
  A = [[1,2,3],[4,5,6],[7,8,10]]; det = det3(A); steps = [];
  E("—");
  expl("已重置为初始矩阵 A。");
  render();
};
function expl(html){ document.getElementById('expl').innerHTML = html; }
det = det3(A);
render();
</script>
</body>
</html>
