<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高斯消元法 · 逐步演示</title>
<style>
  :root{
    --bg:#12151c; --panel:#1a1f29; --panel2:#222838; --line:#2e3646;
    --txt:#e8ecf3; --dim:#9aa5b5; --acc:#6cb6ff; --acc2:#f0a35e; --ok:#7bd88f; --warn:#ff7b72;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;padding:20px;}
  h1{font-size:18px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:16px}
  .wrap{display:flex;gap:20px;flex-wrap:wrap}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  #matrixCard{flex:0 0 auto}
  #sysCard{flex:1;min-width:280px}
  table.m{border-collapse:collapse;font-family:"SF Mono",Consolas,Menlo,monospace;font-size:20px}
  table.m td{padding:8px 14px;text-align:center;min-width:44px;transition:all .45s ease;border-radius:6px}
  table.m td.num{background:var(--panel2);margin:2px}
  table.m td.pivot{outline:2px solid var(--acc);color:var(--acc)}
  table.m td.changed{background:#2b3a55;color:var(--acc)}
  table.m tr td:first-child{color:var(--dim);font-size:13px;padding-right:6px;min-width:0}
  .bar{display:inline-block;width:2px;background:var(--dim);margin:0 8px;border-radius:2px}
  .note{margin-top:14px;font-size:14px;color:var(--acc2);min-height:44px;line-height:1.5}
  .btns{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
  button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 16px;font-size:14px;cursor:pointer;transition:.2s}
  button:hover{border-color:var(--acc);color:var(--acc)}
  button.primary{background:var(--acc);color:#0b1220;border-color:var(--acc);font-weight:600}
  button.primary:hover{filter:brightness(1.1);color:#0b1220}
  .eq{font-family:"SF Mono",Consolas,Menlo,monospace;font-size:17px;line-height:2}
  .eq .hl{color:var(--acc)}
  .eq .solved{color:var(--ok)}
  .stepTag{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:2px 12px;font-size:12px;color:var(--dim);margin-bottom:10px}
  .vars{color:var(--dim);font-size:12px;margin-top:6px}
</style>
</head>
<body>
<h1>高斯消元法 · 逐步演示</h1>
<div class="sub">三类初等变换（对调方程 / 方程 ×k / 方程 +k×另一方程）都是可逆的，所以变换前后的方程组同解。</div>
<div class="wrap">
  <div class="card" id="matrixCard">
    <div class="stepTag" id="stepTag">初始增广矩阵</div>
    <table class="m" id="mat"></table>
    <div class="vars">r₁ r₂ r₃ 为方程编号；竖线右侧为常数项</div>
  </div>
  <div class="card" id="sysCard">
    <div class="stepTag">等价方程组</div>
    <div class="eq" id="sys"></div>
    <div class="note" id="note">点击「下一步」开始消元。观察：每一步只做允许的三种变换之一。</div>
    <div class="btns">
      <button class="primary" id="nextBtn">下一步 ▶</button>
      <button id="autoBtn">自动播放</button>
      <button id="resetBtn">重置</button>
    </div>
  </div>
</div>

<script>
// 方程组：x1+2x2+3x3=2 ; 2x1+4x2+x3=9 ; 3x1+2x2+9x3=-2  => 解 (1,2,-1)
const steps = [
  { m:[[1,2,3,2],[2,4,1,9],[3,2,9,-2]],
    note:"初始增广矩阵。第一列主元已是 1（a₁₁=1），可以直接用它消去下方元素。",
    sys:["x₁ + 2x₂ + 3x₃ = 2","2x₁ + 4x₂ + x₃ = 9","3x₁ + 2x₂ + 9x₃ = −2"] },
  { m:[[1,2,3,2],[0,0,-5,5],[0,-4,0,-8]],
    note:"r₂ − 2r₁，r₃ − 3r₁（变换类型 3：一个方程加上另一个方程的 k 倍）。第一列下方清成 0。",
    sys:["x₁ + 2x₂ + 3x₃ = 2","−5x₃ = 5","−4x₂ = −8"], pivot:[0,0] },
  { m:[[1,2,3,2],[0,-4,0,-8],[0,0,-5,5]],
    note:"第二列主元位置是 0，对调 r₂ ↔ r₃（变换类型 1：对调两个方程的次序），把非零主元换上来。",
    sys:["x₁ + 2x₂ + 3x₃ = 2","−4x₂ = −8","−5x₃ = 5"], pivot:[1,1] },
  { m:[[1,2,3,2],[0,1,0,2],[0,0,-5,5]],
    note:"r₂ ÷ (−4)（变换类型 2：以非零的数乘某个方程）。主元化为 1，得到 x₂ = 2。",
    sys:["x₁ + 2x₂ + 3x₃ = 2","x₂ = 2","−5x₃ = 5"], pivot:[1,1] },
  { m:[[1,2,3,2],[0,1,0,2],[0,0,1,-1]],
    note:"r₃ ÷ (−5)。此时已化为行阶梯形，可以「回代」求解；也可以继续消成行最简形。",
    sys:["x₁ + 2x₂ + 3x₃ = 2","x₂ = 2","x₃ = −1"], pivot:[2,2] },
  { m:[[1,0,3,-2],[0,1,0,2],[0,0,1,-1]],
    note:"r₁ − 2r₂：消去第一行第二列的 2（类型 3）。注意右端常数也要同步相减：2 − 2×2 = −2。",
    sys:["x₁ + 3x₃ = −2","x₂ = 2","x₃ = −1"], pivot:[0,1] },
  { m:[[1,0,0,1],[0,1,0,2],[0,0,1,-1]],
    note:"r₁ − 3r₃：−2 − 3×(−1) = 1。化为行最简形，解直接读出。",
    sys:["x₁ = 1","x₂ = 2","x₃ = −1"], pivot:[0,2], solved:true }
];
let idx = 0, timer = null;
const matEl = document.getElementById('mat');
const sysEl = document.getElementById('sys');
const noteEl = document.getElementById('note');
const tagEl = document.getElementById('stepTag');

function render(i){
  const s = steps[i];
  let html = "";
  for(let r=0;r<3;r++){
    html += "<tr><td>r"+(r+1)+"</td>";
    for(let c=0;c<3;c++){
      const v = s.m[r][c];
      const isP = s.pivot && s.pivot[0]===r && s.pivot[1]===c;
      html += `<td class="num${isP?' pivot':''}">${v}</td>`;
    }
    html += `<td style="padding:0"><span class="bar" style="height:34px;display:inline-block"></span></td>`;
    html += `<td class="num">${s.m[r][3]}</td></tr>`;
  }
  matEl.innerHTML = html;
  sysEl.innerHTML = s.sys.map((e,k)=>{
    const parts = e.split("=");
    const rhs = s.solved ? `<span class="solved">= ${parts[1].trim()}</span>` : `= ${parts[1].trim()}`;
    return `<div>${parts[0].trim()} ${rhs}</div>`;
  }).join("");
  noteEl.textContent = s.note;
  tagEl.textContent = `第 ${i} / ${steps.length-1} 步`;
}
document.getElementById('nextBtn').onclick = ()=>{ if(idx<steps.length-1){ idx++; render(idx);} };
document.getElementById('resetBtn').onclick = ()=>{ idx=0; render(idx); stopAuto(); };
function stopAuto(){ if(timer){clearInterval(timer);timer=null;document.getElementById('autoBtn').textContent='自动播放';} }
document.getElementById('autoBtn').onclick = function(){
  if(timer){ stopAuto(); return; }
  this.textContent = "暂停";
  idx = 0; render(0);
  timer = setInterval(()=>{
    if(idx>=steps.length-1){ stopAuto(); return; }
    idx++; render(idx);
  }, 1800);
};
render(0);
</script>
</body>
</html>
