-anchor="start">竖线右侧：常数项 b；整体为增广矩阵 (A|b)</text><text x="60" y="196" font-size="13" fill="#9aa5b5" text-anchor="start">矩阵形式：Ax = b</text><text x="60" y="218" font-size="13" fill="#9aa5b5" text-anchor="start">b = 0 ⇒ 齐次；b ≠ 0 ⇒ 非齐次</text><text x="60" y="240" font-size="13" fill="#7bd88f" text-anchor="start">Ax = 0 对任意 x 成立 ⇔ A = O（用 E 按列分块证明）</text></svg>