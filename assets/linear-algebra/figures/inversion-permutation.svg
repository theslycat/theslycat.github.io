<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 210" font-family="Consolas,Menlo,monospace"><rect width="680" height="210" fill="#12151c"/><text x="30" y="34" font-size="16" fill="#e8ecf3">排列 32514 的逆序：每个元素「前面比它大的数码」个数之和</text><rect x="60" y="70" width="44" height="36" rx="5" fill="#222838"/><text x="82.0" y="93.0" text-anchor="middle" font-size="18" fill="#e8ecf3">3</text><text x="82" y="126" font-size="12" fill="#f0a35e" text-anchor="middle">逆序数 0</text><rect x="124" y="70" width="44" height="36" rx="5" fill="#222838"/><text x="146.0" y="93.0" text-anchor="middle" font-size="18" fill="#e8ecf3">2</text><text x="146" y="126" font-size="12" fill="#f0a35e" text-anchor="middle">逆序数 1</text><rect x="188" y="70" width="44" height="36" rx="5" fill="#222838"/><text x="210.0" y="93.0" text-anchor="middle" font-size="18" fill="#e8ecf3">5</text><text x="210" y="126" font-size="12" fill="#f0a35e" text-anchor="middle">逆序数 0</text><rect x="252" y="70" width="44" height="36" rx="5" fill="#222838"/><text x="274.0" y="93.0" text-anchor="middle" font-size="18" fill="#e8ecf3">1</text><text x="274" y="126" font-size="12" fill="#f0a35e" text-anchor="middle">逆序数 3</text><rect x="316" y="70" width="44" height="36" rx="5" fill="#222838"/><text x="338.0" y="93.0" text-anchor="middle" font-size="18" fill="#e8ecf3">4</text><text x="338" y="126" font-size="12" fill="#f0a35e" text-anchor="middle">逆序数 1</text><text x="60" y="160" font-size="15" fill="#e8ecf3" text-anchor="start">τ(32514) = 0+1+0+3+1 = 5 ⇒ 奇排列</text><text x="60" y="186" font-size="13" fill="#9aa5b5" text-anchor="start">对换任意两个元素会改变奇偶性 ⇒ 对换次数与排列奇偶性一致（154362 → 123456 需 7 次对换，奇数）。</text></svg>