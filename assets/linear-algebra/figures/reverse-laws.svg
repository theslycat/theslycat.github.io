<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" font-family="Consolas,Menlo,monospace"><rect width="680" height="220" fill="#12151c"/><text x="30" y="34" font-size="16" fill="#e8ecf3">两条「反序」律：先作用的在后面</text><text x="60" y="76" font-size="15" fill="#e8ecf3" text-anchor="start">(AB)ᵀ = BᵀAᵀ</text><text x="60" y="104" font-size="13" fill="#9aa5b5" text-anchor="start">转置把行变列，乘法的行列对应关系被「翻过来」</text><text x="60" y="140" font-size="15" fill="#e8ecf3" text-anchor="start">(AB)⁻¹ = B⁻¹A⁻¹</text><text x="60" y="168" font-size="13" fill="#9aa5b5" text-anchor="start">撤销要按相反顺序：先脱鞋后脱袜子（穿衣顺序的逆）</text><text x="400" y="80" font-size="13" fill="#ff7b72" text-anchor="start">同理：A⁻¹ + B⁻¹ 的逆 = B(A+B)⁻¹A</text><text x="400" y="108" font-size="13" fill="#9aa5b5" text-anchor="start">（例 5：先凑出 A⁻¹(A+B)B⁻¹，</text><text x="400" y="130" font-size="13" fill="#9aa5b5" text-anchor="start">再整体取逆，顺序自然反过来了）</text><text x="400" y="160" font-size="13" fill="#7bd88f" text-anchor="start">f(A)·g(A) = g(A)·f(A)（同一矩阵的多项式可交换）</text><text x="400" y="188" font-size="13" fill="#9aa5b5" text-anchor="start">但 f(A)·g(B) 一般 ≠ g(B)·f(A)</text></svg>