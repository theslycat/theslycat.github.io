<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" font-family="Consolas,Menlo,monospace"><rect width="680" height="260" fill="#12151c"/><text x="30" y="34" font-size="16" fill="#e8ecf3">范德蒙德行列式：每一行都是「1, x, x², …, xⁿ⁻¹」</text><rect x="50" y="56" width="52" height="34" rx="5" fill="#222838"/><text x="76.0" y="78.0" text-anchor="middle" font-size="14" fill="#e8ecf3">1</text><rect x="102" y="56" width="52" height="34" rx="5" fill="#222838"/><text x="128.0" y="78.0" text-anchor="middle" font-size="14" fill="#e8ecf3">x₁</text><rect x="154" y="56" width="52" height="34" rx="5" fill="#222838"/><text x="180.0" y="78.0" text-anchor="middle" font-size="14" fill="#e8ecf3">x₁²</text><rect x="206" y="56" width="52" height="34" rx="5" fill="#222838"/><text x="232.0" y="78.0" text-anchor="middle" font-size="14" fill="#e8ecf3">⋯</text><rect x="258" y="56" width="52" height="34" rx="5" fill="#222838"/><text x="284.0" y="78.0" text-anchor="middle" font-size="14" fill="#e8ecf3">x₁ⁿ⁻¹</text><rect x="50" y="90" width="52" height="34" rx="5" fill="#222838"/><text x="76.0" y="112.0" text-anchor="middle" font-size="14" fill="#e8ecf3">1</text><rect x="102" y="90" width="52" height="34" rx="5" fill="#222838"/><text x="128.0" y="112.0" text-anchor="middle" font-size="14" fill="#e8ecf3">x₂</text><rect x="154" y="90" width="52" height="34" rx="5" fill="#222838"/><text x="180.0" y="112.0" text-anchor="middle" font-size="14" fill="#e8ecf3">x₂²</text><rect x="206" y="90" width="52" height="34" rx="5" fill="#222838"/><text x="232.0" y="112.0" text-anchor="middle" font-size="14" fill="#e8ecf3">⋯</text><rect x="258" y="90" width="52" height="34" rx="5" fill="#222838"/><text x="284.0" y="112.0" text-anchor="middle" font-size="14" fill="#e8ecf3">x₂ⁿ⁻¹</text><rect x="50" y="124" width="52" height="34" rx="5" fill="#222838"/><text x="76.0" y="146.0" text-anchor="middle" font-size="14" fill="#e8ecf3">1</text><rect x="102" y="124" width="52" height="34" rx="5" fill="#222838"/><text x="128.0" y="146.0" text-anchor="middle" font-size="14" fill="#e8ecf3">x₃</text><rect x="154" y="124" width="52" height="34" rx="5" fill="#222838"/><text x="180.0" y="146.0" text-anchor="middle" font-size="14" fill="#e8ecf3">x₃²</text><rect x="206" y="124" width="52" height="34" rx="5" fill="#222838"/><text x="232.0" y="146.0" text-anchor="middle" font-size="14" fill="#e8ecf3">⋯</text><rect x="258" y="124" width="52" height="34" rx="5" fill="#222838"/><text x="284.0" y="146.0" text-anchor="middle" font-size="14" fill="#e8ecf3">x₃ⁿ⁻¹</text><rect x="50" y="158" width="52" height="34" rx="5" fill="#222838"/><text x="76.0" y="180.0" text-anchor="middle" font-size="14" fill="#e8ecf3">⋮</text><rect x="102" y="158" width="52" height="34" rx="5" fill="#222838"/><text x="128.0" y="180.0" text-anchor="middle" font-size="14" fill="#e8ecf3">⋮</text><rect x="154" y="158" width="52" height="34" rx="5" fill="#222838"/><text x="180.0" y="180.0" text-anchor="middle" font-size="14" fill="#e8ecf3">⋮</text><rect x="206" y="158" width="52" height="34" rx="5" fill="#222838"/><text x="232.0" y="180.0" text-anchor="middle" font-size="14" fill="#e8ecf3">⋱</text><rect x="258" y="158" width="52" height="34" rx="5" fill="#222838"/><text x="284.0" y="180.0" text-anchor="middle" font-size="14" fill="#e8ecf3">⋮</text><rect x="50" y="192" width="52" height="34" rx="5" fill="#222838"/><text x="76.0" y="214.0" text-anchor="middle" font-size="14" fill="#e8ecf3">1</text><rect x="102" y="192" width="52" height="34" rx="5" fill="#222838"/><text x="128.0" y="214.0" text-anchor="middle" font-size="14" fill="#e8ecf3">xₙ</text><rect x="154" y="192" width="52" height="34" rx="5" fill="#222838"/><text x="180.0" y="214.0" text-anchor="middle" font-size="14" fill="#e8ecf3">xₙ²</text><rect x="206" y="192" width="52" height="34" rx="5" fill="#222838"/><text x="232.0" y="214.0" text-anchor="middle" font-size="14" fill="#e8ecf3">⋯</text><rect x="258" y="192" width="52" height="34" rx="5" fill="#222838"/><text x="284.0" y="214.0" text-anchor="middle" font-size="14" fill="#e8ecf3">xₙⁿ⁻¹</text><text x="50" y="250" font-size="14" fill="#e8ecf3" text-anchor="start">Dₙ = ∏<sub>1≤j&lt;i≤n</sub> (xᵢ − xⱼ)</text><text x="360" y="80" font-size="13" fill="#9aa5b5" text-anchor="start">证明思路（数学归纳法）：</text><text x="360" y="106" font-size="13" fill="#e8ecf3" text-anchor="start">① n=2 直接验证</text><text x="360" y="130" font-size="13" fill="#e8ecf3" text-anchor="start">② 按第 1 列展开，相邻行相减</text><text x="360" y="154" font-size="13" fill="#e8ecf3" text-anchor="start">③ 每列提取公因子 (xᵢ−xⱼ)</text><text x="360" y="178" font-size="13" fill="#e8ecf3" text-anchor="start">④ 剩下 n−1 阶范德蒙德，用归纳假设</text><text x="360" y="206" font-size="13" fill="#7bd88f" text-anchor="start">xᵢ 互不相同 ⇔ Dₙ ≠ 0 ⇔ 矩阵可逆</text><text x="360" y="230" font-size="13" fill="#9aa5b5" text-anchor="start">⇒ 幂次方程组唯一解、插值多项式唯一、DFT 可逆</text></svg>