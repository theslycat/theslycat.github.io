<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>矩阵的秩 = 列空间的维度 · 3D 可视化</title>
<style>
  :root{
    --bg:#12151c; --panel:#1a1f29; --panel2:#222838; --line:#2e3646;
    --txt:#e8ecf3; --dim:#9aa5b5; --acc:#6cb6ff; --acc2:#f0a35e; --ok:#7bd88f; --warn:#ff7b72;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;padding:20px;}
  h1{font-size:18px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:14px}
  .wrap{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  #view{flex:1;min-width:320px}
  #ctl{flex:0 0 340px}
  label{display:flex;justify-content:space-between;font-size:13px;color:var(--dim);margin:6px 0 2px}
  label span{color:var(--acc);font-family:Consolas,monospace}
  input[type=range]{width:100%;accent-color:#6cb6ff}
  .btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:13px;cursor:pointer}
  button:hover{border-color:var(--acc);color:var(--acc)}
  .info{margin-top:14px;font-family:Consolas,monospace;font-size:14px;line-height:2;color:var(--dim);background:var(--panel2);border-radius:10px;padding:12px}
  .info b{color:var(--acc2);font-size:18px}
  .note{margin-top:10px;font-size:13px;color:var(--dim);line-height:1.8}
  .note em{color:var(--ok);font-style:normal}
  svg{display:block;width:100%;height:auto;background:#0d1017;border-radius:10px}
</style>
</head>
<body>
<h1>矩阵的秩 = 列向量张成的空间维度</h1>
<div class="sub">三列向量 α₁、α₂、α₃：能张出整个三维空间时秩为 3；落进同一个平面时秩降为 2（det=0，奇异）；全部共线时秩为 1。秩 = 行阶梯形矩阵的非零行数 = 最高阶非零子式的阶数。</div>
<div class="wrap">
  <div class="card" id="view">
    <svg id="svg" viewBox="-190 -150 380 300"></svg>
  </div>
  <div class="card" id="ctl">
    <label>α₁ = (x₁,y₁,z₁)　橙<span id="v1">(1.0, 0.0, 0.0)</span></label>
    <input type="range" id="x1" min="-1.5" max="1.5" step="0.1" value="1">
    <input type="range" id="y1" min="-1.5" max="1.5" step="0.1" value="0">
    <input type="range" id="z1" min="-1.5" max="1.5" step="0.1" value="0">
    <label>α₂ = (x₂,y₂,z₂)　绿<span id="v2">(0.0, 1.0, 0.0)</span></label>
    <input type="range" id="x2" min="-1.5" max="1.5" step="0.1" value="0">
    <input type="range" id="y2" min="-1.5" max="1.5" step="0.1" value="1">
    <input type="range" id="z2" min="-1.5" max="1.5" step="0.1" value="0">
    <label>α₃ = (x₃,y₃,z₃)　蓝<span id="v3">(1.0, 1.0, 1.0)</span></label>
    <input type="range" id="x3" min="-1.5" max="1.5" step="0.1" value="1">
    <input type="range" id="y3" min="-1.5" max="1.5" step="0.1" value="1">
    <input type="range" id="z3" min="-1.5" max="1.5" step="0.1" value="1">
    <div class="btns">
      <button id="rank3">满秩 3</button>
      <button id="rank2">秩 2（共面）</button>
      <button id="rank1">秩 1（共线）</button>
    </div>
    <div class="info">
      R(A) = <b id="rank">3</b> ｜ 列空间维度 = <b id="dim">3</b><br>
      det A = <b id="det">1.00</b>
    </div>
    <div class="note" id="msg"></div>
  </div>
</div>

<script>
const S=42;
const svg=document.getElementById('svg');
const NS="http://www.w3.org/2000/svg";
// 斜二测投影：3D (x,y,z) -> 2D (x*S - z*S*0.5, -y*S - z*S*0.45)
function proj(x,y,z){ return [x*S - z*S*0.5, -y*S - z*S*0.45]; }
function mk(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);(parent||svg).appendChild(e);return e;}
function setArrow(l,h,x1,y1,x2,y2){
  l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);
  const ang=Math.atan2(y2-y1,x2-x1),s=9;
  h.setAttribute('points',`${x2},${y2} ${x2-s*Math.cos(ang-0.42)},${y2-s*Math.sin(ang-0.42)} ${x2-s*Math.cos(ang+0.42)},${y2-s*Math.sin(ang+0.42)}`);
}
// 坐标轴与参考平面
[[1,0,0],[0,1,0],[0,0,1]].forEach((v,i)=>{
  const [x2,y2]=proj(v[0]*3,v[1]*3,v[2]*3);
  mk('line',{x1:0,y1:0,x2,y2,stroke:'#3a4658','stroke-width':1.5});
  mk('text',{x:x2+6,y:y2+4,'font-size':12,fill:'#5a6577'}).textContent=['x','y','z'][i];
});
const plane=mk('polygon',{fill:'rgba(108,182,255,.06)',stroke:'rgba(108,182,255,.35)','stroke-width':1.2,'stroke-dasharray':'6 4'});
const p00=proj(0,0,0),p10=proj(2.2,0,0),p11=proj(2.2,2.2,0),p01=proj(0,2.2,0);
plane.setAttribute('points',`${p00} ${p10} ${p11} ${p01}`);
const planeLbl=mk('text',{x:proj(1.1,1.1,0)[0]-24,y:proj(1.1,1.1,0)[1]+16,'font-size':11,fill:'#6cb6ff'});
planeLbl.textContent='xy 平面（秩≤2 时止步于此）';
// 三个向量
function mkVec(color){
  const g=mk('g',{});
  g._l=mk('line',{stroke:color,'stroke-width':3.5,'stroke-linecap':'round'},g);
  g._h=mk('polygon',{fill:color},g);
  return g;
}
const v1=mkVec('#f0a35e'), v2=mkVec('#7bd88f'), v3=mkVec('#6cb6ff');
const l1=mk('text',{'font-size':13,fill:'#f0a35e'}); l1.textContent='α₁';
const l2=mk('text',{'font-size':13,fill:'#7bd88f'}); l2.textContent='α₂';
const l3=mk('text',{'font-size':13,fill:'#6cb6ff'}); l3.textContent='α₃';

let cols=[[1,0,0],[0,1,0],[1,1,1]];
function readSliders(){
  cols=[
    [gv('x1'),gv('y1'),gv('z1')],
    [gv('x2'),gv('y2'),gv('z2')],
    [gv('x3'),gv('y3'),gv('z3')]
  ];
}
function gv(id){ return parseFloat(document.getElementById(id).value); }
function rankCols(c){
  const mm=c.map(r=>r.slice()); let r=0;
  for(let col=0;col<3&&r<3;col++){
    let piv=-1;
    for(let i=r;i<3;i++) if(Math.abs(mm[i][col])>1e-9){piv=i;break;}
    if(piv<0) continue;
    [mm[r],mm[piv]]=[mm[piv],mm[r]];
    for(let i=r+1;i<3;i++){ const f=mm[i][col]/mm[r][col];
      for(let j=0;j<3;j++) mm[i][j]-=f*mm[r][j]; }
    r++;
  }
  return r;
}
function det3(M){
  return M[0][0]*(M[1][1]*M[2][2]-M[1][2]*M[2][1])
       -M[0][1]*(M[1][0]*M[2][2]-M[1][2]*M[2][0])
       +M[0][2]*(M[1][0]*M[2][1]-M[1][1]*M[2][0]);
}
const fmt=x=>(Math.round(x*10)/10).toString();
function render(){
  readSliders();
  document.getElementById('v1').textContent=`(${fmt(cols[0][0])}, ${fmt(cols[0][1])}, ${fmt(cols[0][2])})`;
  document.getElementById('v2').textContent=`(${fmt(cols[1][0])}, ${fmt(cols[1][1])}, ${fmt(cols[1][2])})`;
  document.getElementById('v3').textContent=`(${fmt(cols[2][0])}, ${fmt(cols[2][1])}, ${fmt(cols[2][2])})`;
  const vecs=[v1,v2,v3], lbls=[l1,l2,l3];
  cols.forEach((c,i)=>{
    const [x,y]=proj(c[0],c[1],c[2]);
    setArrow(vecs[i]._l,vecs[i]._h,0,0,x,y);
    lbls[i].setAttribute('x',x+8); lbls[i].setAttribute('y',y+14);
  });
  const R=rankCols(cols);
  const D=det3(cols);
  document.getElementById('rank').textContent=R;
  document.getElementById('dim').textContent=R;
  document.getElementById('det').textContent=(Math.round(D*100)/100);
  const msg=document.getElementById('msg');
  if(R===3){
    msg.innerHTML='三列<em>线性无关</em>，张满三维空间：R(A)=3，det A ≠ 0，A 可逆（非奇异），Ax=b 有唯一解。';
  }else if(R===2){
    msg.innerHTML='三列<em>共面</em>：列空间是一个平面，R(A)=2，det A = 0（<em>奇异</em>），A 不可逆，Ax=b 无解或无穷多解。';
  }else{
    msg.innerHTML='三列<em>共线</em>：列空间退化成一条直线，R(A)=1。所有列都是彼此的倍数 ⇒ 任意两行成比例 ⇒ det = 0。';
  }
}
['x1','y1','z1','x2','y2','z2','x3','y3','z3'].forEach(id=>{
  document.getElementById(id).addEventListener('input',render);
});
function setSliders(c){
  const ids=['x1','y1','z1','x2','y2','z2','x3','y3','z3'];
  ids.forEach((id,i)=>document.getElementById(id).value=c[Math.floor(i/3)][i%3]);
  render();
}
document.getElementById('rank3').onclick=()=>setSliders([[1,0,0],[0,1,0],[1,1,1]]);
document.getElementById('rank2').onclick=()=>setSliders([[1,0,0],[0,1,0],[1,1,0]]);
document.getElementById('rank1').onclick=()=>setSliders([[1,0,0],[0.6,0,0],[1.2,0,0]]);
render();
</script>
</body>
</html>
