<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Consolas,Menlo,monospace"><rect width="680" height="300" fill="#12151c"/><text x="30" y="34" font-size="16" fill="#e8ecf3">爪型行列式：第一行、第一列及对角线以外全为 0</text><rect x="60" y="60" width="44" height="40" rx="5" fill="#222838"/><text x="82.0" y="85.0" text-anchor="middle" font-size="17" fill="#e8ecf3">x</text><rect x="104" y="60" width="44" height="40" rx="5" fill="#222838"/><text x="126.0" y="85.0" text-anchor="middle" font-size="17" fill="#e8ecf3">a</text><rect x="148" y="60" width="44" height="40" rx="5" fill="#222838"/><text x="170.0" y="85.0" text-anchor="middle" font-size="17" fill="#e8ecf3">a</text><rect x="192" y="60" width="44" height="40" rx="5" fill="#222838"/><text x="214.0" y="85.0" text-anchor="middle" font-size="17" fill="#e8ecf3">a</text><rect x="60" y="100" width="44" height="40" rx="5" fill="#222838"/><text x="82.0" y="125.0" text-anchor="middle" font-size="17" fill="#e8ecf3">b</text><rect x="104" y="100" width="44" height="40" rx="5" fill="#222838"/><text x="126.0" y="125.0" text-anchor="middle" font-size="17" fill="#e8ecf3">y</text><rect x="148" y="100" width="44" height="40" rx="5" fill="#222838"/><text x="170.0" y="125.0" text-anchor="middle" font-size="17" fill="#e8ecf3">0</text><rect x="192" y="100" width="44" height="40" rx="5" fill="#222838"/><text x="214.0" y="125.0" text-anchor="middle" font-size="17" fill="#e8ecf3">0</text><rect x="60" y="140" width="44" height="40" rx="5" fill="#222838"/><text x="82.0" y="165.0" text-anchor="middle" font-size="17" fill="#e8ecf3">b</text><rect x="104" y="140" width="44" height="40" rx="5" fill="#222838"/><text x="126.0" y="165.0" text-anchor="middle" font-size="17" fill="#e8ecf3">0</text><rect x="148" y="140" width="44" height="40" rx="5" fill="#222838"/><text x="170.0" y="165.0" text-anchor="middle" font-size="17" fill="#e8ecf3">y</text><rect x="192" y="140" width="44" height="40" rx="5" fill="#222838"/><text x="214.0" y="165.0" text-anchor="middle" font-size="17" fill="#e8ecf3">0</text><rect x="60" y="180" width="44" height="40" rx="5" fill="#222838"/><text x="82.0" y="205.0" text-anchor="middle" font-size="17" fill="#e8ecf3">b</text><rect x="104" y="180" width="44" height="40" rx="5" fill="#222838"/><text x="126.0" y="205.0" text-anchor="middle" font-size="17" fill="#e8ecf3">0</text><rect x="148" y="180" width="44" height="40" rx="5" fill="#222838"/><text x="170.0" y="205.0" text-anchor="middle" font-size="17" fill="#e8ecf3">0</text><rect x="192" y="180" width="44" height="40" rx="5" fill="#222838"/><text x="214.0" y="205.0" text-anchor="middle" font-size="17" fill="#e8ecf3">y</text><rect x="104" y="60" width="44" height="40" rx="6" fill="#f0a35e" fill-opacity="0.18" stroke="#f0a35e" stroke-width="1.5"/><text x="126" y="86" text-anchor="middle" font-size="17" fill="#e8ecf3">a</text><rect x="148" y="60" width="44" height="40" rx="6" fill="#f0a35e" fill-opacity="0.18" stroke="#f0a35e" stroke-width="1.5"/><text x="170" y="86" text-anchor="middle" font-size="17" fill="#e8ecf3">a</text><rect x="192" y="60" width="44" height="40" rx="6" fill="#f0a35e" fill-opacity="0.18" stroke="#f0a35e" stroke-width="1.5"/><text x="214" y="86" text-anchor="middle" font-size="17" fill="#e8ecf3">a</text><rect x="60" y="100" width="44" height="40" rx="6" fill="#f0a35e" fill-opacity="0.18" stroke="#f0a35e" stroke-width="1.5"/><text x="82" y="126" text-anchor="middle" font-size="17" fill="#e8ecf3">b</text><rect x="60" y="140" width="44" height="40" rx="6" fill="#f0a35e" fill-opacity="0.18" stroke="#f0a35e" stroke-width="1.5"/><text x="82" y="166" text-anchor="middle" font-size="17" fill="#e8ecf3">b</text><rect x="60" y="180" width="44" height="40" rx="6" fill="#f0a35e" fill-opacity="0.18" stroke="#f0a35e" stroke-width="1.5"/><text x="82" y="206" text-anchor="middle" font-size="17" fill="#e8ecf3">b</text><text x="60" y="270" font-size="13" fill="#9aa5b5" text-anchor="start">解法：用第 1 行把第 1 列「爪」消成 0（或反之），化成三角形 / 分块后即得</text><text x="320" y="80" font-size="13" fill="#9aa5b5" text-anchor="start">思路链：</text><text x="320" y="106" font-size="13" fill="#6cb6ff" text-anchor="start">r₂ − (b/x)r₁, r₃ − (b/x)r₁, r₄ − (b/x)r₁</text><text x="320" y="130" font-size="13" fill="#9aa5b5" text-anchor="start">⇒ 第 1 列下方全 0（性质 5，det 不变）</text><text x="320" y="158" font-size="13" fill="#9aa5b5" text-anchor="start">⇒ 按第 1 列展开（定理 2.3）：</text><text x="320" y="186" font-size="14" fill="#f0a35e" text-anchor="start">D = x · |y 0 0; 0 y 0; 0 0 y| = x·y³ …</text><text x="320" y="214" font-size="13" fill="#9aa5b5" text-anchor="start">（具体数值以课堂例题为准，</text><text x="320" y="236" font-size="13" fill="#9aa5b5" text-anchor="start">方法固定：消爪 → 三角/分块 → 展开）</text></svg>