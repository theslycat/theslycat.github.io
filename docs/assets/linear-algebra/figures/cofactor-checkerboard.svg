<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Consolas,Menlo,monospace"><rect width="680" height="300" fill="#12151c"/><text x="30" y="34" font-size="16" fill="#e8ecf3">代数余子式的符号棋盘：A_ij = (−1)^(i+j) · M_ij</text><rect x="240" y="60" width="44" height="40" rx="6" fill="#222838"/><text x="262" y="86" font-size="18" fill="#7bd88f" text-anchor="middle">+</text><text x="262" y="52" font-size="11" fill="#9aa5b5" text-anchor="middle">j=1</text><rect x="284" y="60" width="44" height="40" rx="6" fill="#222838"/><text x="306" y="86" font-size="18" fill="#ff7b72" text-anchor="middle">−</text><text x="306" y="52" font-size="11" fill="#9aa5b5" text-anchor="middle">j=2</text><rect x="328" y="60" width="44" height="40" rx="6" fill="#222838"/><text x="350" y="86" font-size="18" fill="#7bd88f" text-anchor="middle">+</text><text x="350" y="52" font-size="11" fill="#9aa5b5" text-anchor="middle">j=3</text><rect x="372" y="60" width="44" height="40" rx="6" fill="#222838"/><text x="394" y="86" font-size="18" fill="#ff7b72" text-anchor="middle">−</text><text x="394" y="52" font-size="11" fill="#9aa5b5" text-anchor="middle">j=4</text><text x="230" y="86" font-size="11" fill="#9aa5b5" text-anchor="end">i=1</text><rect x="240" y="100" width="44" height="40" rx="6" fill="#222838"/><text x="262" y="126" font-size="18" fill="#ff7b72" text-anchor="middle">−</text><text x="262" y="92" font-size="11" fill="#9aa5b5" text-anchor="middle">j=1</text><rect x="284" y="100" width="44" height="40" rx="6" fill="#222838"/><text x="306" y="126" font-size="18" fill="#7bd88f" text-anchor="middle">+</text><text x="306" y="92" font-size="11" fill="#9aa5b5" text-anchor="middle">j=2</text><rect x="328" y="100" width="44" height="40" rx="6" fill="#222838"/><text x="350" y="126" font-size="18" fill="#ff7b72" text-anchor="middle">−</text><text x="350" y="92" font-size="11" fill="#9aa5b5" text-anchor="middle">j=3</text><rect x="372" y="100" width="44" height="40" rx="6" fill="#222838"/><text x="394" y="126" font-size="18" fill="#7bd88f" text-anchor="middle">+</text><text x="394" y="92" font-size="11" fill="#9aa5b5" text-anchor="middle">j=4</text><text x="230" y="126" font-size="11" fill="#9aa5b5" text-anchor="end">i=2</text><rect x="240" y="140" width="44" height="40" rx="6" fill="#222838"/><text x="262" y="166" font-size="18" fill="#7bd88f" text-anchor="middle">+</text><text x="262" y="132" font-size="11" fill="#9aa5b5" text-anchor="middle">j=1</text><rect x="284" y="140" width="44" height="40" rx="6" fill="#222838"/><text x="306" y="166" font-size="18" fill="#ff7b72" text-anchor="middle">−</text><text x="306" y="132" font-size="11" fill="#9aa5b5" text-anchor="middle">j=2</text><rect x="328" y="140" width="44" height="40" rx="6" fill="#222838"/><text x="350" y="166" font-size="18" fill="#7bd88f" text-anchor="middle">+</text><text x="350" y="132" font-size="11" fill="#9aa5b5" text-anchor="middle">j=3</text><rect x="372" y="140" width="44" height="40" rx="6" fill="#222838"/><text x="394" y="166" font-size="18" fill="#ff7b72" text-anchor="middle">−</text><text x="394" y="132" font-size="11" fill="#9aa5b5" text-anchor="middle">j=4</text><text x="230" y="166" font-size="11" fill="#9aa5b5" text-anchor="end">i=3</text><rect x="240" y="180" width="44" height="40" rx="6" fill="#222838"/><text x="262" y="206" font-size="18" fill="#ff7b72" text-anchor="middle">−</text><text x="262" y="172" font-size="11" fill="#9aa5b5" text-anchor="middle">j=1</text><rect x="284" y="180" width="44" height="40" rx="6" fill="#222838"/><text x="306" y="206" font-size="18" fill="#7bd88f" text-anchor="middle">+</text><text x="306" y="172" font-size="11" fill="#9aa5b5" text-anchor="middle">j=2</text><rect x="328" y="180" width="44" height="40" rx="6" fill="#222838"/><text x="350" y="206" font-size="18" fill="#ff7b72" text-anchor="middle">−</text><text x="350" y="172" font-size="11" fill="#9aa5b5" text-anchor="middle">j=3</text><rect x="372" y="180" width="44" height="40" rx="6" fill="#222838"/><text x="394" y="206" font-size="18" fill="#7bd88f" text-anchor="middle">+</text><text x="394" y="172" font-size="11" fill="#9aa5b5" text-anchor="middle">j=4</text><text x="230" y="206" font-size="11" fill="#9aa5b5" text-anchor="end">i=4</text><text x="60" y="80" font-size="13" fill="#9aa5b5" text-anchor="start">定义：划去 a_ij 所在的第 i 行、第 j 列，</text><text x="60" y="102" font-size="13" fill="#9aa5b5" text-anchor="start">余下元素按原次序构成 n−1 阶行列式</text><text x="60" y="124" font-size="13" fill="#9aa5b5" text-anchor="start">M_ij（余子式）。</text><text x="60" y="180" font-size="13" fill="#9aa5b5" text-anchor="start">定理 2.3：D = Σ a_ij·A_ij（按行 / 按列展开）</text><text x="60" y="202" font-size="13" fill="#9aa5b5" text-anchor="start">定理 2.4：拿另一行的元素来乘这些余子式，和为 0</text><text x="60" y="230" font-size="13" fill="#7bd88f" text-anchor="start">技巧：先选 0 最多的行（列）展开，计算量最小。</text></svg>