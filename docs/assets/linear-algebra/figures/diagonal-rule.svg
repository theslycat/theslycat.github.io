<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="Consolas,Menlo,monospace"><rect width="680" height="300" fill="#12151c"/><text x="30" y="34" font-size="16" fill="#e8ecf3">二阶 / 三阶行列式的对角线法则（仅适用于 2、3 阶！）</text><rect x="60" y="70" width="34" height="28" rx="5" fill="#222838"/><text x="77.0" y="89.0" text-anchor="middle" font-size="15" fill="#e8ecf3">a₁₁</text><rect x="94" y="70" width="34" height="28" rx="5" fill="#222838"/><text x="111.0" y="89.0" text-anchor="middle" font-size="15" fill="#e8ecf3">a₁₂</text><rect x="60" y="98" width="34" height="28" rx="5" fill="#222838"/><text x="77.0" y="117.0" text-anchor="middle" font-size="15" fill="#e8ecf3">a₂₁</text><rect x="94" y="98" width="34" height="28" rx="5" fill="#222838"/><text x="111.0" y="117.0" text-anchor="middle" font-size="15" fill="#e8ecf3">a₂₂</text><text x="140" y="92" font-size="16" fill="#e8ecf3" text-anchor="start">= a₁₁·a₂₂ − a₁₂·a₂₁</text><line x1="60" y1="70" x2="128" y2="126" stroke="#f0a35e" stroke-width="2.5"/><line x1="94" y1="70" x2="60" y2="126" stroke="#6cb6ff" stroke-width="2.5" stroke-dasharray="6 4"/><text x="132" y="60" font-size="12" fill="#f0a35e" text-anchor="start">主对角线（实线，取 +）</text><text x="132" y="76" font-size="12" fill="#6cb6ff" text-anchor="start">副对角线（虚线，取 −）</text><rect x="60" y="160" width="34" height="28" rx="5" fill="#222838"/><text x="77.0" y="179.0" text-anchor="middle" font-size="15" fill="#e8ecf3">a₁₁</text><rect x="94" y="160" width="34" height="28" rx="5" fill="#222838"/><text x="111.0" y="179.0" text-anchor="middle" font-size="15" fill="#e8ecf3">a₁₂</text><rect x="128" y="160" width="34" height="28" rx="5" fill="#222838"/><text x="145.0" y="179.0" text-anchor="middle" font-size="15" fill="#e8ecf3">a₁₃</text><rect x="60" y="188" width="34" height="28" rx="5" fill="#222838"/><text x="77.0" y="207.0" text-anchor="middle" font-size="15" fill="#e8ecf3">a₂₁</text><rect x="94" y="188" width="34" height="28" rx="5" fill="#222838"/><text x="111.0" y="207.0" text-anchor="middle" font-size="15" fill="#e8ecf3">a₂₂</text><rect x="128" y="188" width="34" height="28" rx="5" fill="#222838"/><text x="145.0" y="207.0" text-anchor="middle" font-size="15" fill="#e8ecf3">a₂₃</text><rect x="60" y="216" width="34" height="28" rx="5" fill="#222838"/><text x="77.0" y="235.0" text-anchor="middle" font-size="15" fill="#e8ecf3">a₃₁</text><rect x="94" y="216" width="34" height="28" rx="5" fill="#222838"/><text x="111.0" y="235.0" text-anchor="middle" font-size="15" fill="#e8ecf3">a₃₂</text><rect x="128" y="216" width="34" height="28" rx="5" fill="#222838"/><text x="145.0" y="235.0" text-anchor="middle" font-size="15" fill="#e8ecf3">a₃₃</text><text x="170" y="200" font-size="16" fill="#e8ecf3" text-anchor="start">= a₁₁a₂₂a₃₃ + a₁₂a₂₃a₃₁ + a₁₃a₂₁a₃₂ − a₁₃a₂₂a₃₁ − a₁₂a₂₁a₃₃ − a₁₁a₂₃a₃₂</text><line x1="60" y1="160" x2="162" y2="262" stroke="#f0a35e" stroke-width="2.5"/><line x1="94" y1="160" x2="128" y2="248" stroke="#f0a35e" stroke-width="2.5"/><line x1="128" y1="160" x2="162" y2="204" stroke="#f0a35e" stroke-width="2.5"/><line x1="162" y1="160" x2="60" y2="248" stroke="#6cb6ff" stroke-width="2.5" stroke-dasharray="6 4"/><line x1="128" y1="160" x2="94" y2="248" stroke="#6cb6ff" stroke-width="2.5" stroke-dasharray="6 4"/><line x1="162" y1="204" x2="60" y2="160" stroke="#6cb6ff" stroke-width="2.5" stroke-dasharray="6 4"/><text x="330" y="160" font-size="12" fill="#9aa5b5" text-anchor="start">实线 3 项取正号，虚线 3 项取负号，共 3! = 6 项；</text><text x="330" y="180" font-size="12" fill="#9aa5b5" text-anchor="start">每项都是「不同行不同列」的三个元素之积。</text><text x="330" y="204" font-size="12" fill="#ff7b72" text-anchor="start">4 阶以上对角线法则失效，必须用定义 / 性质 / 展开。</text></svg>